# Desenvolvimento: apenas o PostgreSQL, acessível só nesta máquina.
# A porta 5433 evita conflito com um PostgreSQL instalado localmente.
name: wrexercise-dev

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: wrexercise_dev
      POSTGRES_USER: wrexercise
      POSTGRES_PASSWORD: wrexercise_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    # Por TCP: na primeira inicialização, o servidor temporário só atende pelo socket Unix.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wrexercise -d wrexercise_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  dev_postgres:
