# Publica a pilha local por um túnel da Cloudflare. Usado por run.bat --tunnel, sobre compose.yaml.
# Vai direto ao app, sem passar pelo Caddy: ele só responde a localhost e trocaria o IP do cliente,
# que a Cloudflare informa em X-Forwarded-For, pelo do túnel.

services:
  tunnel:
    image: ${TUNNEL_IMAGE:?use run.bat --tunnel}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://app:8080
      - run
      - --cred-file
      - /etc/cloudflared/credenciais.json
      # O ID dispensa o cert.pem, que resolveria o nome (run.bat --ssh); sem TUNNEL_ID vale o nome.
      - ${TUNNEL_ID:-${TUNNEL_NAME:?use run.bat --tunnel}}
    environment:
      # Atrás do SLIRP do QEMU, QUIC/UDP e IPv6 atrasam o túnel: run.bat --ssh troca para http2 e IPv4.
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_PROTOCOL:-auto}
      TUNNEL_EDGE_IP_VERSION: ${TUNNEL_EDGE_IP:-auto}
    volumes:
      - ${TUNNEL_DIR:?use run.bat --tunnel}/${TUNNEL_NAME}.json:/etc/cloudflared/credenciais.json:ro
    depends_on:
      - app
    mem_limit: 64m
    cpus: 0.10
