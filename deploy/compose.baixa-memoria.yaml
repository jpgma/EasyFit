# Perfil de memória baixa para máquinas pequenas (ex.: VM de 2 GiB no Galaxy A14). Usado por run.bat --ssh,
# sobre compose.yaml. Os valores são os mínimos iniciais: meça com docker stats e ajuste.
#
# O .NET em contêiner já limita o heap a 75% do mem_limit, então o app dispensa DOTNET_GCHeapHardLimit.
# Sem cpus: em QEMU TCG a cota de CPU impede o stop e o healthcheck (contêiner zumbi).

services:
  app:
    mem_limit: 128m
    cpus: !reset null

  db:
    mem_limit: 160m
    cpus: !reset null
    # Em QEMU TCG o initdb da primeira inicialização leva minutos: falhas nesse período não contam.
    healthcheck:
      start_period: 900s
      retries: 10
    command:
      - postgres
      - -c
      - max_connections=10
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9

  backup:
    mem_limit: 128m
    cpus: !reset null

  tunnel:
    mem_limit: 32m
    cpus: !reset null
