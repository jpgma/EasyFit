#cloud-config
# Preparação da VM de produção, aplicada uma única vez na criação da instância.
# Instala o Docker e cria os diretórios persistentes. Ver deploy.bat.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl

write_files:
  # Limita os logs dos contêineres para que não consumam o disco.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "5" }
      }

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker ubuntu
  - install -d -m 0755 -o ubuntu -g ubuntu /opt/easyfit
  # 1654 é o usuário "app" da imagem chiseled da aplicação.
  - install -d -m 0755 /srv/easyfit
  - install -d -m 0750 -o 1654 -g 1654 /srv/easyfit/evidencias
